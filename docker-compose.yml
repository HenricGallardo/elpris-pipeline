volumes:
  pgdata:                                 # Sparar databasen mellan omstarter

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: elpris           # Bara för lokal utveckling. Användare och databas heter "postgres"
    ports:
      - "5432:5432"                       # Macen:containern
    volumes:
      - pgdata:/var/lib/postgresql/data   # PostgreSQL:s datamapp i containern

